name: Build and Deploy Images
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.server }}
      migrate: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.migrate }}
      web: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.web }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            server:
              - "apps/server/**"
              - "packages/api/**"
              - "packages/auth/**"
              - "packages/config/**"
              - "packages/db/**"
              - "packages/env/**"
            migrate:
              - "packages/db/**"
              - "packages/config/**"
              - "packages/env/**"
            web:
              - "apps/web/**"
              - "packages/config/**"
              - "packages/api/**"
              - "packages/auth/**"
              - "packages/db/**"
              - "packages/env/**"

  build-and-push:
    needs: changes
    if: needs.changes.outputs[matrix.name] == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            file: apps/server/Containerfile
            image_suffix: "-server"
          - name: migrate
            file: packages/db/migrate.Containerfile
            image_suffix: "-migrate"
          - name: web
            file: apps/web/Containerfile
            image_suffix: "-web"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE }}${{ matrix.image_suffix }}:${{ secrets.DOCKER_TAG }}
          platforms: linux/arm64/v8
          file: ${{ matrix.file }}
          context: .
