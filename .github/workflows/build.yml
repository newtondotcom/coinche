name: Build and Deploy Images
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            server:
              - "apps/server/**"
              - "packages/api/**"
              - "packages/auth/**"
              - "packages/config/**"
              - "packages/db/**"
              - "packages/env/**"
            migrate:
              - "packages/db/**"
              - "packages/config/**"
              - "packages/env/**"
            web:
              - "apps/web/**"
              - "packages/config/**"
              - "packages/api/**"
              - "packages/auth/**"
              - "packages/db/**"
              - "packages/env/**"

      - name: Compose build matrix
        id: matrix
        env:
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          SERVER: ${{ steps.filter.outputs.server }}
          MIGRATE: ${{ steps.filter.outputs.migrate }}
          WEB: ${{ steps.filter.outputs.web }}
        run: |
          items=()
          if [ "$IS_DISPATCH" = "true" ] || [ "$SERVER" = "true" ]; then
            items+=('{"name":"server","file":"apps/server/Containerfile","image_suffix":"-server"}')
          fi
          if [ "$IS_DISPATCH" = "true" ] || [ "$MIGRATE" = "true" ]; then
            items+=('{"name":"migrate","file":"packages/db/migrate.Containerfile","image_suffix":"-migrate"}')
          fi
          if [ "$IS_DISPATCH" = "true" ] || [ "$WEB" = "true" ]; then
            items+=('{"name":"web","file":"apps/web/Containerfile","image_suffix":"-web"}')
          fi
          joined=$(IFS=,; echo "${items[*]}")
          echo "matrix=[${joined}]" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE }}${{ matrix.image_suffix }}:${{ secrets.DOCKER_TAG }}
          platforms: linux/arm64/v8
          file: ${{ matrix.file }}
          context: .
