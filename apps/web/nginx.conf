server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Behind a TLS-terminating proxy, absolute redirects become http:// and
    # trigger mixed-content blocks for iframes (e.g. /partie → /partie/).
    absolute_redirect off;

    location / {
        try_files $uri $uri/ /index.html;
    }
}